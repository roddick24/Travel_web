<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的私人旅遊管理中心</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .dragging { opacity: 0.4; transform: scale(0.98); }
        .drag-over { border-top: 3px solid #d97706 !important; }
        body { background-color: #fafaf9; color: #292524; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-20">

    <!-- 頂部導覽列（已移除上方的新增按鈕，只保留返回與標題） -->
    <header class="bg-[#78716c] text-white px-4 md:px-6 py-4 shadow-sm flex justify-between items-center">
        <h1 class="text-lg md:text-xl font-bold tracking-wide cursor-pointer flex items-center gap-2" onclick="goHome()">
            🌿 <span>旅色手帳：私人旅遊管理</span>
        </h1>
        <div id="header-nav-btn">
            <!-- 僅在進入詳情頁時動態顯示返回首頁按鈕 -->
        </div>
    </header>

    <!-- 主要內容切換容器 -->
    <main class="w-full p-3 sm:p-4 md:p-8 space-y-4 md:space-y-6 max-w-7xl mx-auto" id="app-container">
        <!-- 動態載入首頁或詳情頁 -->
    </main>

    <!-- 新增旅程 Modal -->
    <div id="new-trip-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl space-y-4 border border-stone-200">
            <h3 class="text-lg font-bold text-[#78716c]">☕ 建立新的出遊行程</h3>
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-stone-600 font-medium mb-1">出遊名稱</label>
                    <input type="text" id="new-trip-title" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-[#78716c]" placeholder="例如: 2027 東京賞櫻行">
                </div>
                <div>
                    <label class="block text-stone-600 font-medium mb-1">出遊天數</label>
                    <input type="number" id="new-trip-days" min="1" max="30" value="5" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50 focus:outline-none focus:ring-2 focus:ring-[#78716c]">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeNewTripModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-sm font-medium transition">取消</button>
                <button onclick="saveNewTrip()" class="px-5 py-2 bg-[#78716c] hover:bg-[#57534e] text-white rounded-xl text-sm font-medium transition">建立並進入</button>
            </div>
        </div>
    </div>

    <!-- 航班編輯 Modal -->
    <div id="flight-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto border border-stone-200">
            <h3 class="text-lg font-bold text-[#78716c]">✈️ 編輯航班資訊</h3>
            <div class="space-y-4 text-sm">
                <div class="border-b border-stone-100 pb-3">
                    <h4 class="font-bold text-stone-700 mb-2">去程航班</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs text-stone-500 mb-1">航班編號</label><input type="text" id="edit-out-no" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                        <div><label class="block text-xs text-stone-500 mb-1">出發時間</label><input type="text" id="edit-out-dep" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                        <div><label class="block text-xs text-stone-500 mb-1">抵達時間</label><input type="text" id="edit-out-arr" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                        <div><label class="block text-xs text-stone-500 mb-1">出發機場(航廈)</label><input type="text" id="edit-out-airport" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                    </div>
                </div>
                <div>
                    <h4 class="font-bold text-stone-700 mb-2">回程航班</h4>
                    <div class="grid grid-cols-2 gap-2">
                        <div><label class="block text-xs text-stone-500 mb-1">航班編號</label><input type="text" id="edit-in-no" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                        <div><label class="block text-xs text-stone-500 mb-1">出發時間</label><input type="text" id="edit-in-dep" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                        <div><label class="block text-xs text-stone-500 mb-1">抵達時間</label><input type="text" id="edit-in-arr" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                        <div><label class="block text-xs text-stone-500 mb-1">出發機場(航廈)</label><input type="text" id="edit-in-airport" class="w-full border border-stone-300 rounded-xl p-2.5 text-xs bg-stone-50"></div>
                    </div>
                </div>
                <div><label class="block text-stone-600 font-medium mb-1">行李限制</label><input type="text" id="edit-baggage" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeFlightModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveFlight()" class="px-5 py-2 bg-[#78716c] hover:bg-[#57534e] text-white rounded-xl text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <!-- 住宿編輯 Modal -->
    <div id="hotel-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto border border-stone-200">
            <h3 class="text-lg font-bold text-[#78716c]">🏨 編輯住宿資訊</h3>
            <div class="space-y-3 text-sm">
                <div><label class="block text-stone-600 font-medium mb-1">飯店名稱</label><input type="text" id="edit-hotel-name" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
                <div><label class="block text-stone-600 font-medium mb-1">英文地址</label><input type="text" id="edit-hotel-en" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
                <div><label class="block text-stone-600 font-medium mb-1">日文地址</label><input type="text" id="edit-hotel-jp" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
                <div><label class="block text-stone-600 font-medium mb-1">鄰近車站</label><input type="text" id="edit-hotel-station" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
                <div><label class="block text-stone-600 font-medium mb-1">如何前往（交通方式）</label><textarea id="edit-hotel-route" rows="2" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></textarea></div>
                <div class="grid grid-cols-2 gap-3">
                    <div><label class="block text-stone-600 font-medium mb-1">入住時間</label><input type="text" id="edit-hotel-checkin" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
                    <div><label class="block text-stone-600 font-medium mb-1">退房時間</label><input type="text" id="edit-hotel-checkout" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></div>
                </div>
                <div>
                    <label class="block text-stone-600 font-medium mb-1">Google Maps 地點短網址</label>
                    <input type="text" id="edit-hotel-map" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50" placeholder="https://maps.app.goo.gl/...">
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeHotelModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveHotel()" class="px-5 py-2 bg-[#78716c] hover:bg-[#57534e] text-white rounded-xl text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <!-- 新增景點 Modal -->
    <div id="spot-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl space-y-4 border border-stone-200">
            <h3 class="text-lg font-bold text-amber-700">🍁 新增景點到口袋清單</h3>
            <div class="space-y-3 text-sm">
                <div><label class="block text-stone-600 font-medium mb-1">景點名稱</label><input type="text" id="new-spot-name" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50" placeholder="例如: 美麗海水族館"></div>
                <div><label class="block text-stone-600 font-medium mb-1">地點 / 區域</label><input type="text" id="new-spot-location" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50" placeholder="例如: 本部町"></div>
                <div>
                    <label class="block text-stone-600 font-medium mb-1">類型</label>
                    <select id="new-spot-type" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50">
                        <option value="美食">🍜 美食</option>
                        <option value="逛街">🛍️ 逛街</option>
                        <option value="體驗">🎨 體驗</option>
                        <option value="親子">👨‍👩‍👧‍👦 親子</option>
                    </select>
                </div>
                <div>
                    <label class="block text-stone-600 font-medium mb-1">預計日期</label>
                    <select id="new-spot-date" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50"></select>
                </div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeSpotModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveNewSpot()" class="px-5 py-2 bg-amber-700 hover:bg-amber-800 text-white rounded-xl text-sm font-medium">新增</button>
            </div>
        </div>
    </div>

    <!-- 編輯 Day 標題 Modal -->
    <div id="day-titles-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl space-y-4 max-h-[90vh] overflow-y-auto border border-stone-200">
            <h3 class="text-lg font-bold text-[#78716c]">✏️ 編輯每日行程摘要</h3>
            <div class="space-y-3 text-sm" id="day-titles-inputs"></div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeDayTitlesModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveDayTitles()" class="px-5 py-2 bg-[#78716c] hover:bg-[#57534e] text-white rounded-xl text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <!-- 新增 / 編輯詳細時間軸行程 Modal -->
    <div id="timeline-modal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-xs z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-xl space-y-4 border border-stone-200">
            <h3 class="text-lg font-bold text-[#78716c]" id="timeline-modal-title">⏰ 新增詳細行程</h3>
            <input type="hidden" id="timeline-day-idx">
            <input type="hidden" id="timeline-item-idx">
            <div class="space-y-3 text-sm">
                <div>
                    <label class="block text-stone-600 font-medium mb-1">時間 (24小時制)</label>
                    <input type="time" id="timeline-time" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50" value="10:00">
                </div>
                <div><label class="block text-stone-600 font-medium mb-1">行程內容</label><input type="text" id="timeline-title" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50" placeholder="例如: 參觀美麗海水族館"></div>
                <div><label class="block text-stone-600 font-medium mb-1">備註</label><textarea id="timeline-note" rows="2" class="w-full border border-stone-300 rounded-xl p-3 text-sm bg-stone-50" placeholder="例如: 記得先買好預售票"></textarea></div>
            </div>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="closeTimelineModal()" class="px-4 py-2 bg-stone-100 hover:bg-stone-200 text-stone-600 rounded-xl text-sm font-medium">取消</button>
                <button onclick="saveTimelineItem()" class="px-5 py-2 bg-[#78716c] hover:bg-[#57534e] text-white rounded-xl text-sm font-medium">儲存</button>
            </div>
        </div>
    </div>

    <script>
        let trips = JSON.parse(localStorage.getItem('my_all_trips')) || [
            {
                id: "trip_okinawa_2026",
                title: "沖繩親子慢活行",
                days: 5,
                flight: {
                    outbound: { no: "NU302", dep: "10:05", arr: "12:40", airport: "桃園TPE(T2)" },
                    inbound: { no: "JX871", dep: "15:25", arr: "16:10", airport: "那霸OKA" },
                    baggage: "託運 23kg × 2 / 手提 7kg"
                },
                hotel: {
                    name: "沖繩格拉斯麗飯店 (Hotel Gracery Okinawa)",
                    enAddress: "1-3-3 Matsuo, Naha, Okinawa 900-0014",
                    jpAddress: "〒900-0014 沖縄県那覇市松尾1-3-3",
                    station: "牧志站 (Makishi Station) 步行 5 分鐘",
                    route: "從那覇空港搭乘單軌電車到牧志站下車，出站後沿著國際通步行約 5 分鐘即可抵達。",
                    checkin: "15:00",
                    checkout: "11:00",
                    mapUrl: "https://maps.app.goo.gl/SNADjpiHfPsdBMvt8"
                },
                spots: [
                    { name: "美麗海水族館", location: "本部町", type: "親子", date: "Day 2" },
                    { name: "暖暮拉麵", location: "那霸市", type: "美食", date: "Day 1" }
                ],
                dayTitles: { 1: "抵達與國際通散步", 2: "美麗海水族館", 3: "美國村與購物", 4: "Outlet 掃貨", 5: "伴手禮採買與賦歸" },
                dayTimelines: {
                    1: [{ time: "17:00", title: "暖暮拉麵", note: "美味晚餐" }],
                    2: [{ time: "09:00", title: "美麗海水族館", note: "看海豚秀" }],
                    3: [], 4: [], 5: []
                }
            }
        ];

        let currentTripId = localStorage.getItem('current_trip_id') || null;
        let activeDay = 1;

        function getCurrentTrip() { return trips.find(t => t.id === currentTripId) || null; }

        function initApp() {
            const trip = getCurrentTrip();
            const navBtn = document.getElementById('header-nav-btn');
            if (!trip) {
                // 首頁導覽列右側保持乾淨，不放新增按鈕
                navBtn.innerHTML = ``;
                renderHomeDashboard();
            } else {
                navBtn.innerHTML = `<button onclick="goHome()" class="bg-stone-600 hover:bg-stone-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-xs">🏠 返回旅程列表</button>`;
                renderTripDetail(trip);
            }
        }

        function renderHomeDashboard() {
            const container = document.getElementById('app-container');
            let html = `
                <div class="max-w-4xl mx-auto space-y-6">
                    <div class="bg-white rounded-3xl p-6 shadow-xs border border-stone-200 flex justify-between items-center">
                        <div>
                            <h2 class="text-xl font-bold text-[#78716c]">🌍 我的出遊清單</h2>
                            <p class="text-xs text-stone-400 mt-1">挑選一本手帳開始規劃，或建立新的旅程！</p>
                        </div>
                        <button onclick="openNewTripModal()" class="bg-amber-700 hover:bg-amber-800 text-white px-5 py-2.5 rounded-2xl text-sm font-bold transition shadow-xs">＋ 新增出遊</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            `;
            if (trips.length === 0) {
                html += `<div class="col-span-2 bg-white p-8 rounded-3xl text-center text-stone-400 border border-stone-200">目前還沒有建立任何出遊計畫！</div>`;
            } else {
                trips.forEach(trip => {
                    html += `
                        <div class="bg-white rounded-3xl p-6 shadow-xs border border-stone-200 hover:border-amber-700/50 transition flex flex-col justify-between space-y-4">
                            <div>
                                <div class="flex justify-between items-start">
                                    <h3 class="text-lg font-bold text-stone-800">${trip.title}</h3>
                                    <span class="text-xs bg-stone-100 text-stone-600 px-3 py-1 rounded-full font-semibold">${trip.days}天行程</span>
                                </div>
                                <p class="text-xs text-stone-500 mt-2">飯店：${trip.hotel.name}</p>
                            </div>
                            <div class="flex justify-end gap-2 pt-3 border-t border-stone-100">
                                <button onclick="deleteTrip('${trip.id}')" class="text-stone-400 hover:text-red-500 text-xs px-3 py-1.5 rounded-xl transition">🗑️ 刪除</button>
                                <button onclick="selectTrip('${trip.id}')" class="bg-[#78716c] hover:bg-[#57534e] text-white text-xs px-4 py-2 rounded-xl font-bold transition shadow-xs">開啟手帳 ➔</button>
                            </div>
                        </div>
                    `;
                });
            }
            html += `</div></div>`;
            container.innerHTML = html;
        }

        function selectTrip(id) { currentTripId = id; localStorage.setItem('current_trip_id', id); activeDay = 1; initApp(); }
        function goHome() { currentTripId = null; localStorage.removeItem('current_trip_id'); initApp(); }
        function deleteTrip(id) {
            if (confirm("確定要刪除這個出遊計畫嗎？")) {
                trips = trips.filter(t => t.id !== id);
                localStorage.setItem('my_all_trips', JSON.stringify(trips));
                initApp();
            }
        }

        function openNewTripModal() {
            document.getElementById('new-trip-title').value = '';
            document.getElementById('new-trip-days').value = '5';
            document.getElementById('new-trip-modal').classList.remove('hidden');
        }
        function closeNewTripModal() { document.getElementById('new-trip-modal').classList.add('hidden'); }

        function saveNewTrip() {
            const title = document.getElementById('new-trip-title').value.trim();
            const days = parseInt(document.getElementById('new-trip-days').value) || 5;
            if (!title) { alert("請輸入出遊名稱！"); return; }

            const newId = 'trip_' + Date.now();
            let newDayTitles = {};
            let newDayTimelines = {};
            for (let i = 1; i <= days; i++) {
                newDayTitles[i] = i === 1 ? "出發與抵達" : `第 ${i} 天行程`;
                newDayTimelines[i] = [];
            }

            const newTrip = {
                id: newId, title, days,
                flight: { outbound: { no: "請輸入", dep: "00:00", arr: "00:00", airport: "TPE" }, inbound: { no: "請輸入", dep: "00:00", arr: "00:00", airport: "當地" }, baggage: "託運 23kg / 手提 7kg" },
                hotel: { name: "請輸入飯店名稱", enAddress: "English Address", jpAddress: "日文地址", station: "鄰近車站", route: "交通方式說明", checkin: "15:00", checkout: "11:00", mapUrl: "" },
                spots: [], dayTitles: newDayTitles, dayTimelines: newDayTimelines
            };
            trips.push(newTrip);
            localStorage.setItem('my_all_trips', JSON.stringify(trips));
            closeNewTripModal();
            selectTrip(newId);
        }

        function renderTripDetail(trip) {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="flex justify-between items-center bg-stone-200/60 border border-stone-200 p-4 rounded-3xl">
                    <div>
                        <span class="text-xs text-stone-500 font-bold block">目前瀏覽的手帳</span>
                        <h2 class="text-xl font-bold text-stone-800">${trip.title} (${trip.days}天行程)</h2>
                    </div>
                </div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-4 md:gap-6">
                    <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-stone-200 relative">
                        <div class="flex justify-between items-center mb-4">
                            <h2 class="text-base md:text-lg font-bold text-[#78716c] flex items-center gap-2">🛫 航班資訊</h2>
                            <button onclick="openFlightModal()" class="bg-stone-100 hover:bg-stone-200 text-stone-600 px-3 py-1.5 rounded-xl text-xs font-semibold transition">✏️ 編輯航班</button>
                        </div>
                        <div class="space-y-4 text-xs sm:text-sm" id="flight-info-container"></div>
                    </div>

                    <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-stone-200 relative">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="text-base md:text-lg font-bold text-[#78716c] flex items-center gap-2">🏨 住宿飯店</h2>
                            <button onclick="openHotelModal()" class="bg-stone-100 hover:bg-stone-200 text-stone-600 px-3 py-1.5 rounded-xl text-xs font-semibold transition">✏️ 編輯住宿</button>
                        </div>
                        <div class="space-y-3 text-xs sm:text-sm" id="hotel-info-container"></div>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-stone-200">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-base md:text-lg font-bold text-amber-800 flex items-center gap-2">⭐ 景點口袋清單資料庫</h2>
                        <button onclick="openSpotModal()" class="bg-amber-700 hover:bg-amber-800 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-xs shrink-0">＋ 新增景點</button>
                    </div>
                    <div class="overflow-x-auto -mx-4 sm:mx-0 px-4 sm:px-0">
                        <table class="w-full text-left border-collapse text-xs sm:text-sm min-w-[500px]">
                            <thead>
                                <tr class="bg-stone-50 text-stone-500 border-b border-stone-100">
                                    <th class="p-3 font-semibold">名稱</th>
                                    <th class="p-3 font-semibold">地點</th>
                                    <th class="p-3 font-semibold">類型</th>
                                    <th class="p-3 font-semibold">預計日期</th>
                                    <th class="p-3 font-semibold text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="spot-table-body" class="divide-y divide-stone-100"></tbody>
                        </table>
                    </div>
                </div>

                <div class="bg-white rounded-3xl p-5 sm:p-6 shadow-xs border border-stone-200 space-y-4">
                    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-2 border-b border-stone-100 pb-3">
                        <h2 class="text-base md:text-lg font-bold text-[#78716c] flex items-center gap-2">📅 每日行程時間軸</h2>
                        <button onclick="openDayTitlesModal()" class="bg-stone-100 hover:bg-stone-200 text-stone-600 px-3 py-1.5 rounded-xl text-xs font-semibold transition">✏️ 編輯每日標題</button>
                    </div>
                    <div class="flex gap-2 overflow-x-auto py-2 no-scrollbar" id="day-tabs-container"></div>
                    <div id="active-day-panel" class="bg-stone-50/70 border border-stone-200 rounded-2xl p-4 sm:p-6"></div>
                </div>
            `;

            renderFlight(trip);
            renderHotel(trip);
            renderSpots(trip);
            renderItineraryTabs(trip);
        }

        function renderFlight(trip) {
            const container = document.getElementById('flight-info-container');
            const fd = trip.flight;
            container.innerHTML = `
                <div>
                    <span class="text-xs font-bold text-stone-500 block mb-1">🛫 去程航班</span>
                    <table class="w-full text-left border-collapse text-xs">
                        <tr class="bg-stone-50 text-stone-400 border-b border-stone-100"><th class="p-2">航班編號</th><th class="p-2">出發</th><th class="p-2">抵達</th><th class="p-2">機場(航廈)</th></tr>
                        <tr><td class="p-2 font-bold">${fd.outbound.no}</td><td class="p-2">${fd.outbound.dep}</td><td class="p-2">${fd.outbound.arr}</td><td class="p-2">${fd.outbound.airport}</td></tr>
                    </table>
                </div>
                <div>
                    <span class="text-xs font-bold text-stone-500 block mb-1">🛬 回程航班</span>
                    <table class="w-full text-left border-collapse text-xs">
                        <tr class="bg-stone-50 text-stone-400 border-b border-stone-100"><th class="p-2">航班編號</th><th class="p-2">出發</th><th class="p-2">抵達</th><th class="p-2">機場(航廈)</th></tr>
                        <tr><td class="p-2 font-bold">${fd.inbound.no}</td><td class="p-2">${fd.inbound.dep}</td><td class="p-2">${fd.inbound.arr}</td><td class="p-2">${fd.inbound.airport}</td></tr>
                    </table>
                </div>
                <div class="text-xs text-stone-500">行李限制：<span class="font-semibold text-stone-700">${fd.baggage}</span></div>
            `;
            saveTripsToStorage();
        }

        function renderHotel(trip) {
            const container = document.getElementById('hotel-info-container');
            const hd = trip.hotel;
            const targetUrl = hd.mapUrl || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(hd.name + ' ' + hd.jpAddress)}`;
            container.innerHTML = `
                <a href="${targetUrl}" target="_blank" class="block w-full h-36 bg-stone-100 hover:bg-stone-200 rounded-2xl overflow-hidden border border-stone-200 relative group transition shadow-xs flex flex-col items-center justify-center p-4 text-center">
                    <span class="text-3xl mb-1">📍</span>
                    <span class="text-sm font-bold text-stone-800">${hd.name}</span>
                    <span class="text-xs text-stone-500 mt-1 bg-white px-3 py-1 rounded-full shadow-xs group-hover:bg-[#78716c] group-hover:text-white transition">🔍 開啟 Google Maps 導航</span>
                </a>
                <p class="text-sm sm:text-base font-bold text-stone-900 mt-2">飯店名稱：${hd.name}</p>
                <p class="text-stone-500">📍 英文地址：${hd.enAddress}</p>
                <p class="text-stone-500">📍 日文地址：${hd.jpAddress}</p>
                <p class="font-medium text-stone-700">🚉 鄰近車站：${hd.station}</p>
                <p class="text-stone-600 bg-stone-50 p-2.5 rounded-xl leading-relaxed border border-stone-100">🚗 如何前往：${hd.route}</p>
                <div class="flex gap-4 pt-2 text-xs font-semibold text-stone-700 border-t border-stone-100 mt-2">
                    <span>🕒 入住：${hd.checkin}</span>
                    <span>⏳ 退房：${hd.checkout}</span>
                </div>
            `;
            saveTripsToStorage();
        }

        function renderSpots(trip) {
            const tbody = document.getElementById('spot-table-body');
            tbody.innerHTML = '';
            if (trip.spots.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-stone-400">目前沒有景點，點擊上方按鈕新增！</td></tr>`;
            } else {
                trip.spots.forEach((spot, index) => {
                    let badgeColor = "bg-stone-100 text-stone-700";
                    if (spot.type === '美食') badgeColor = "bg-orange-50 text-orange-700 border border-orange-200";
                    if (spot.type === '逛街') badgeColor = "bg-purple-50 text-purple-700 border border-purple-200";
                    if (spot.type === '體驗') badgeColor = "bg-teal-50 text-teal-700 border border-teal-200";
                    if (spot.type === '親子') badgeColor = "bg-rose-50 text-rose-700 border border-rose-200";

                    tbody.innerHTML += `
                        <tr class="hover:bg-stone-50/80 transition">
                            <td class="p-3 font-semibold text-stone-800">${spot.name}</td>
                            <td class="p-3 text-stone-500">${spot.location}</td>
                            <td class="p-3"><span class="${badgeColor} px-2.5 py-1 rounded-lg text-xs font-medium">${spot.type}</span></td>
                            <td class="p-3 text-stone-700 font-medium">${spot.date}</td>
                            <td class="p-3 text-center whitespace-nowrap">
                                <button onclick="openMap('${spot.name}')" class="text-stone-400 hover:text-amber-700 text-xs px-2 py-1">🗺️ 導航</button>
                                <button onclick="deleteSpot(${index})" class="text-stone-400 hover:text-red-500 text-xs px-2 py-1">🗑️ 刪除</button>
                            </td>
                        </tr>
                    `;
                });
            }
            saveTripsToStorage();
        }

        function renderItineraryTabs(trip) {
            const tabsContainer = document.getElementById('day-tabs-container');
            if (!tabsContainer) return;
            tabsContainer.innerHTML = '';

            for (let i = 1; i <= trip.days; i++) {
                const isActive = (i === activeDay);
                const btn = document.createElement('button');
                btn.className = isActive 
                    ? "bg-[#78716c] text-white px-5 py-2.5 rounded-2xl font-bold text-sm shadow-xs shrink-0 transition" 
                    : "bg-stone-100 hover:bg-stone-200 text-stone-600 px-5 py-2.5 rounded-2xl font-semibold text-sm shrink-0 transition";
                btn.innerHTML = `Day ${i} <span class="text-xs opacity-75 block font-normal">${trip.dayTitles[i] || ''}</span>`;
                btn.onclick = () => { activeDay = i; renderItineraryTabs(trip); };
                tabsContainer.appendChild(btn);
            }
            renderActiveDayPanel(trip);
            saveTripsToStorage();
        }

        function renderActiveDayPanel(trip) {
            const panel = document.getElementById('active-day-panel');
            if (!panel) return;
            const subtitle = trip.dayTitles[activeDay] || '';
            const items = trip.dayTimelines[activeDay] || [];

            let timelineHtml = '';
            if (items.length === 0) {
                timelineHtml = `<p class="text-xs text-stone-400 italic py-8 text-center border-2 border-dashed border-stone-200 rounded-2xl bg-white">今天還沒有新增詳細時間軸行程</p>`;
            } else {
                timelineHtml = `<div class="space-y-2.5 mt-3">`;
                items.forEach((item, idx) => {
                    timelineHtml += `
                        <div draggable="true" ondragstart="onDragStart(event, ${activeDay}, ${idx})" ondragover="onDragOver(event)" ondragleave="onDragLeave(event)" ondrop="onDrop(event, ${activeDay}, ${idx})"
                             class="bg-white border border-stone-200 rounded-2xl p-4 flex justify-between items-center shadow-xs cursor-grab active:cursor-grabbing hover:border-stone-400 transition">
                            <div class="flex items-start gap-3">
                                <span class="text-stone-300 font-bold select-none mt-1">☰</span>
                                <span class="bg-stone-100 text-stone-700 font-bold text-xs px-2.5 py-1.5 rounded-xl shrink-0 mt-0.5">${item.time || '10:00'}</span>
                                <div>
                                    <h4 class="font-bold text-stone-800 text-sm">${item.title}</h4>
                                    ${item.note ? `<p class="text-xs text-stone-500 mt-0.5">📝 ${item.note}</p>` : ''}
                                </div>
                            </div>
                            <div class="flex items-center gap-1 shrink-0">
                                <button onclick="openTimelineModal(${activeDay}, ${idx})" class="p-2 hover:bg-stone-100 rounded-xl text-xs text-stone-600 transition">✏️</button>
                                <button onclick="deleteTimelineItem(${activeDay}, ${idx})" class="p-2 hover:bg-red-50 rounded-xl text-xs text-red-500 transition">🗑️</button>
                            </div>
                        </div>
                    `;
                });
                timelineHtml += `</div>`;
            }

            panel.innerHTML = `
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-stone-200 pb-4 gap-2">
                    <div>
                        <span class="font-bold text-[#78716c] text-xl">Day ${activeDay}</span>
                        <span class="text-sm text-stone-600 font-medium ml-2">${subtitle}</span>
                    </div>
                    <button onclick="openTimelineModal(${activeDay})" class="bg-[#78716c] hover:bg-[#57534e] text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow-xs">＋ 新增行程</button>
                </div>
                ${timelineHtml}
            `;
        }

        function saveTripsToStorage() { localStorage.setItem('my_all_trips', JSON.stringify(trips)); }

        // 拖拉排序
        let draggedData = null;
        function onDragStart(event, dayIdx, itemIdx) { draggedData = { dayIdx, itemIdx }; event.target.classList.add('dragging'); }
        function onDragOver(event) { event.preventDefault(); const c = event.target.closest('[draggable="true"]'); if (c) c.classList.add('drag-over'); }
        function onDragLeave(event) { const c = event.target.closest('[draggable="true"]'); if (c) c.classList.remove('drag-over'); }
        function onDrop(event, targetDayIdx, targetItemIdx) {
            event.preventDefault();
            const c = event.target.closest('[draggable="true"]');
            if (c) c.classList.remove('drag-over');
            if (!draggedData) return;
            const trip = getCurrentTrip();
            const sourceDayIdx = draggedData.dayIdx;
            const sourceItemIdx = draggedData.itemIdx;
            if (sourceDayIdx === targetDayIdx && sourceItemIdx !== targetItemIdx) {
                const list = trip.dayTimelines[sourceDayIdx];
                const moved = list.splice(sourceItemIdx, 1)[0];
                list.splice(targetItemIdx, 0, moved);
                renderItineraryTabs(trip);
            }
            draggedData = null;
        }

        // 各項 Modal 與編輯動作
        function openFlightModal() {
            const trip = getCurrentTrip();
            document.getElementById('edit-out-no').value = trip.flight.outbound.no;
            document.getElementById('edit-out-dep').value = trip.flight.outbound.dep;
            document.getElementById('edit-out-arr').value = trip.flight.outbound.arr;
            document.getElementById('edit-out-airport').value = trip.flight.outbound.airport;
            document.getElementById('edit-in-no').value = trip.flight.inbound.no;
            document.getElementById('edit-in-dep').value = trip.flight.inbound.dep;
            document.getElementById('edit-in-arr').value = trip.flight.inbound.arr;
            document.getElementById('edit-in-airport').value = trip.flight.inbound.airport;
            document.getElementById('edit-baggage').value = trip.flight.baggage;
            document.getElementById('flight-modal').classList.remove('hidden');
        }
        function closeFlightModal() { document.getElementById('flight-modal').classList.add('hidden'); }
        function saveFlight() {
            const trip = getCurrentTrip();
            trip.flight.outbound = { no: document.getElementById('edit-out-no').value, dep: document.getElementById('edit-out-dep').value, arr: document.getElementById('edit-out-arr').value, airport: document.getElementById('edit-out-airport').value };
            trip.flight.inbound = { no: document.getElementById('edit-in-no').value, dep: document.getElementById('edit-in-dep').value, arr: document.getElementById('edit-in-arr').value, airport: document.getElementById('edit-in-airport').value };
            trip.flight.baggage = document.getElementById('edit-baggage').value;
            renderFlight(trip);
            closeFlightModal();
        }

        function openHotelModal() {
            const trip = getCurrentTrip();
            document.getElementById('edit-hotel-name').value = trip.hotel.name;
            document.getElementById('edit-hotel-en').value = trip.hotel.enAddress;
            document.getElementById('edit-hotel-jp').value = trip.hotel.jpAddress;
            document.getElementById('edit-hotel-station').value = trip.hotel.station;
            document.getElementById('edit-hotel-route').value = trip.hotel.route;
            document.getElementById('edit-hotel-checkin').value = trip.hotel.checkin;
            document.getElementById('edit-hotel-checkout').value = trip.hotel.checkout;
            document.getElementById('edit-hotel-map').value = trip.hotel.mapUrl || '';
            document.getElementById('hotel-modal').classList.remove('hidden');
        }
        function closeHotelModal() { document.getElementById('hotel-modal').classList.add('hidden'); }
        function saveHotel() {
            const trip = getCurrentTrip();
            trip.hotel.name = document.getElementById('edit-hotel-name').value;
            trip.hotel.enAddress = document.getElementById('edit-hotel-en').value;
            trip.hotel.jpAddress = document.getElementById('edit-hotel-jp').value;
            trip.hotel.station = document.getElementById('edit-hotel-station').value;
            trip.hotel.route = document.getElementById('edit-hotel-route').value;
            trip.hotel.checkin = document.getElementById('edit-hotel-checkin').value;
            trip.hotel.checkout = document.getElementById('edit-hotel-checkout').value;
            trip.hotel.mapUrl = document.getElementById('edit-hotel-map').value.trim();
            renderHotel(trip);
            closeHotelModal();
        }

        function openSpotModal() {
            const trip = getCurrentTrip();
            document.getElementById('new-spot-name').value = '';
            document.getElementById('new-spot-location').value = '';
            document.getElementById('new-spot-type').value = '美食';
            
            const select = document.getElementById('new-spot-date');
            select.innerHTML = '';
            for (let i = 1; i <= trip.days; i++) {
                const opt = document.createElement('option');
                opt.value = `Day ${i}`;
                opt.innerText = `Day ${i} (${trip.dayTitles[i] || ''})`;
                select.appendChild(opt);
            }
            document.getElementById('spot-modal').classList.remove('hidden');
        }
        function closeSpotModal() { document.getElementById('spot-modal').classList.add('hidden'); }
        
        function saveNewSpot() {
            const trip = getCurrentTrip();
            const name = document.getElementById('new-spot-name').value.trim();
            if (!name) { alert("請輸入景點名稱！"); return; }
            
            const location = document.getElementById('new-spot-location').value.trim() || "市區";
            const type = document.getElementById('new-spot-type').value;
            const dateStr = document.getElementById('new-spot-date').value;

            trip.spots.push({ name, location, type, date: dateStr });

            const dayNum = parseInt(dateStr.replace('Day ', ''));
            if (!trip.dayTimelines[dayNum]) {
                trip.dayTimelines[dayNum] = [];
            }
            trip.dayTimelines[dayNum].push({
                time: "10:00",
                title: name,
                note: `[${type}] 地點: ${location}`
            });

            renderSpots(trip);
            renderItineraryTabs(trip);
            closeSpotModal();
        }

        function deleteSpot(index) {
            const trip = getCurrentTrip();
            if (confirm("確定要刪除這個景點嗎？")) {
                trip.spots.splice(index, 1);
                renderSpots(trip);
                renderItineraryTabs(trip);
            }
        }

        function openDayTitlesModal() {
            const trip = getCurrentTrip();
            const container = document.getElementById('day-titles-inputs');
            container.innerHTML = '';
            for (let i = 1; i <= trip.days; i++) {
                container.innerHTML += `
                    <div>
                        <label class="block text-stone-600 font-medium mb-1">Day ${i} 標題</label>
                        <input type="text" id="edit-day-${i}" value="${trip.dayTitles[i] || ''}" class="w-full border border-stone-300 rounded-xl p-2.5 text-sm bg-stone-50">
                    </div>
                `;
            }
            document.getElementById('day-titles-modal').classList.remove('hidden');
        }
        function closeDayTitlesModal() { document.getElementById('day-titles-modal').classList.add('hidden'); }
        function saveDayTitles() {
            const trip = getCurrentTrip();
            for (let i = 1; i <= trip.days; i++) {
                trip.dayTitles[i] = document.getElementById(`edit-day-${i}`).value.trim();
            }
            renderItineraryTabs(trip);
            closeDayTitlesModal();
        }

        function openTimelineModal(dayIdx, itemIdx = null) {
            const trip = getCurrentTrip();
            document.getElementById('timeline-day-idx').value = dayIdx;
            document.getElementById('timeline-item-idx').value = itemIdx !== null ? itemIdx : '';
            if (itemIdx !== null) {
                const item = trip.dayTimelines[dayIdx][itemIdx];
                document.getElementById('timeline-modal-title').innerText = `✏️ 編輯 Day ${dayIdx} 行程`;
                document.getElementById('timeline-time').value = item.time || "10:00";
                document.getElementById('timeline-title').value = item.title;
                document.getElementById('timeline-note').value = item.note || '';
            } else {
                document.getElementById('timeline-modal-title').innerText = `⏰ 新增 Day ${dayIdx} 行程`;
                document.getElementById('timeline-time').value = "10:00";
                document.getElementById('timeline-title').value = '';
                document.getElementById('timeline-note').value = '';
            }
            document.getElementById('timeline-modal').classList.remove('hidden');
        }
        function closeTimelineModal() { document.getElementById('timeline-modal').classList.add('hidden'); }
        function saveTimelineItem() {
            const trip = getCurrentTrip();
            const dayIdx = document.getElementById('timeline-day-idx').value;
            const itemIdx = document.getElementById('timeline-item-idx').value;
            const time = document.getElementById('timeline-time').value.trim() || "10:00";
            const title = document.getElementById('timeline-title').value.trim();
            const note = document.getElementById('timeline-note').value.trim();
            if (!title) { alert("請輸入行程內容！"); return; }
            if (!trip.dayTimelines[dayIdx]) trip.dayTimelines[dayIdx] = [];
            if (itemIdx === '') {
                trip.dayTimelines[dayIdx].push({ time, title, note });
            } else {
                trip.dayTimelines[dayIdx][itemIdx] = { time, title, note };
            }
            renderItineraryTabs(trip);
            closeTimelineModal();
        }
        function deleteTimelineItem(dayIdx, itemIdx) {
            const trip = getCurrentTrip();
            if (confirm("確定要刪除這個詳細行程嗎？")) {
                trip.dayTimelines[dayIdx].splice(itemIdx, 1);
                renderItineraryTabs(trip);
            }
        }

        function openMap(q) { window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank'); }

        initApp();
    </script>
</body>
</html>
